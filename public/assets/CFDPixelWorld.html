<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFD Pixel World</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden}
.wrap{position:relative;width:100%;height:100%}
canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.4))}
</style>
</head>
<body>
<div class="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
const cv=document.getElementById('c'),c=cv.getContext('2d');
const W=320,H=180,GY=140,VX=95,G=520,JV=210;
cv.width=W;cv.height=H;
const R=(col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(x|0,y|0,Math.max(w|0,0),Math.max(h|0,0))};
let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

// ---- 12 environments: colors then numbers then weather ----
// [sky0,sky1,mtFar,mtNear,tree,grassTop,grassMid,dirt,dirtLine,cloudShadow,cloudBase,cloudHi,sunColor | stars,aurora,rainbow,fog,sun,moon,flowers | weather,shape]
const B=[
['#2f8cff','#bfe9ff','#7fb0d8','#4fa07a','#2e9d4a','#5be06a','#34b04e','#9a5a34','#7a4426','#a8c0e0','#f4f8ff','#ffffff','#fff2a0',0,0,0,0,1,0,.3,'none',0],   // sunny day
['#62b8ff','#ffe3f0','#9ad0b8','#6bbf8c','#ff9ecb','#7dee7a','#4fc45f','#a1623a','#7e4a2c','#f0b8d0','#fff0f6','#ffffff','#fff6c0',0,0,0,0,.9,0,1,'petal',0], // spring bloom
['#6b7a94','#b9c3d2','#6e7f95','#55677d','#3b7a50','#4fae5e','#348a47','#8a5a3a','#6a4226','#7c8aa0','#a4b0c2','#c9d2de','#dde6f0',0,0,0,.15,0,0,0,'none',0], // overcast
['#3b4660','#7a8aa3','#4c5c76','#3a4a64','#2c6644','#3f9a56','#2a7a42','#6e4228','#53321e','#4a566c','#69778f','#8795ad','#aab8cc',0,0,0,.25,0,0,0,'rain',0], // rain
['#1b2236','#4a5670','#333f58','#273248','#1f4e38','#2f7d46','#1f5f35','#5a3822','#432816','#2c3448','#3f4960','#566178','#8895b0',0,0,0,.2,0,0,0,'storm',0], // thunderstorm
['#4aa8ff','#ffe9c2','#7fb6c8','#4fa98a','#35b455','#6bf07a','#3dbb55','#9a5a34','#7a4426','#c8d4ee','#fff8f0','#ffffff','#fff2a0',0,0,1,0,.8,0,.5,'none',0], // rainbow
['#2b1666','#ffb870','#6a3a8a','#4a2a6e','#2d1f55','#6cc060','#3f8a4a','#7a4430','#5a3220','#c04b97','#ee6fa0','#ffc0cb','#ffd166',0,0,0,0,1,0,0,'none',0], // sunset
['#060a1f','#1c2a5a','#1d2a52','#141d3d','#0f2a3a','#2a6a58','#1a4a40','#3a2a3a','#2a1c2a','#1f2748','#313c6a','#4a5a8c','#ffffff',1,0,0,0,0,1,0,'fire',0], // starry night
['#04101e','#123a5a','#23496d','#183552','#1a4a52','#cfe8ff','#9cc4e8','#5a6a8a','#46557a','#2a3d5e','#425a82','#6a86b0','#ffffff',1,1,0,0,0,.6,0,'snow',1], // aurora
['#7db4e6','#f3e9ff','#b8cfe8','#8fb2d6','#5a8a7a','#ffffff','#cfe6ff','#8a96b0','#6e7a98','#c9d6ec','#eef4ff','#ffffff','#ffffff',0,0,0,.1,.7,0,0,'snow',1], // winter
['#ff9a5a','#ffe2a8','#c0784a','#9a5a3a','#e0702a','#c8a03a','#a07a28','#7a4a2a','#5a341c','#d98a6a','#ffb88a','#ffe0b8','#fff0c0',0,0,0,0,.9,0,0,'leaf',0], // autumn
['#5a5fa8','#ffcfa8','#8a8cc0','#6a6ca0','#4a7a78','#7ac89a','#4a9a78','#7a5a3a','#5a4026','#b89ac0','#e8c0d0','#ffe8e8','#fff0d0',.2,0,0,.5,.7,0,.2,'none',0] // misty dawn
].map(r=>r.map((v,i)=>i<13?hx(v):v));
const NB=B.length,PER=9,BL=2.6;
const lerpN=(a,b,t)=>a+(b-a)*t;

// ---- scenery data ----
const CL=[];for(let l=0;l<3;l++)for(let i=0;i<7-l;i++)CL.push({l,x:rnd()*(W+160),y:[14+rnd()*34,32+rnd()*40,16+rnd()*44][l],s:[.55,.9,1.35][l]*(.8+rnd()*.5)});
const CPAR=[.05,.14,.3],CDR=[2,4,8];
const PUFF=[[0,8,9],[11,3,12],[24,6,10],[35,9,8],[17,10,9]];
const STARS=Array.from({length:50},()=>({x:rnd()*W,y:rnd()*80}));
const BIRDS=[0,1,2,3].map(i=>({x:rnd()*W,y:30+rnd()*40,v:14+rnd()*8,p:rnd()*6}));
const RB=['#ff4d4d','#ff9a3d','#ffe14d','#5be06a','#4dc3ff','#6a6aff','#b36aff'];

// ---- hero ----
const PAL={y:'#ffd166',h:'#f4f1ff',v:'#35c3ff',w:'#d8fbff',r:'#ff4d6d',g:'#ffd166',b:'#3a2a6b'};
const BODY=['...y....','..hhhh..','.hvvvvh.','.hvwwvh.','.hvvvvh.','..hhhh..','.rrrrrr.','rrrrrrrr','.rrggrr.'];
const LEG={a:['.bb..bb.','bb....bb'],b:['..bbbb..','..b..b..'],air:['.bb..bb.','b......b']};
function spr(rows,ox,oy){rows.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[i];if(ch!='.')R(PAL[ch],ox+i,oy+j,1,1)}})}
let h={x:0,y:GY,vy:0,gr:true},camX=0,T=0,dust=[],wp=[],bolt=null,flash=0,dustT=0,P={};
let OB=[],nextX=260;
const PD={pit:16,box:22,rock:22,vor:22};
function gen(lim){while(nextX<lim){const r=rnd(),t=r<.35?'pit':r<.6?'box':r<.8?'rock':'vor',w=t=='pit'?40:14;OB.push({t,x:nextX|0,w,j:0});nextX+=w+130+rnd()*80}}
const inPit=x=>OB.some(o=>o.t=='pit'&&x>o.x&&x<o.x+o.w);
const burstDust=(x,y,n)=>{for(let i=0;i<n;i++)dust.push({x,y,vx:(rnd()-.5)*40,vy:-rnd()*28,l:.4})};

// ---- palette blending ----
function palette(){
  const g=T/PER,i=Math.floor(g)%NB,ph=(T%PER),n=(i+1)%NB;
  let t=ph>PER-BL?(ph-(PER-BL))/BL:0;t=t*t*(3-2*t);
  const a=B[i],b=B[n],o={t,a,b};
  for(let k=0;k<13;k++)o[k]=mix(a[k],b[k],t);
  for(let k=13;k<20;k++)o[k]=lerpN(a[k],b[k],t);
  o.shape=t<.5?a[21]:b[21];o.wa=a[20];o.wb=b[20];
  return o;
}

function update(dt,p){
  T+=dt;camX=h.x-110;gen(camX+W+400);OB=OB.filter(o=>o.x+o.w>camX-80);
  const o=OB.find(q=>!q.j&&q.x+q.w>h.x-2);
  if(o&&h.gr&&o.x-h.x<=PD[o.t]){h.vy=-JV;h.gr=false;o.j=1;burstDust(h.x,h.y,5)}
  const over=inPit(h.x);
  h.x+=VX*dt;h.vy+=G*dt;h.y+=h.vy*dt;
  if(!over&&h.y>=GY&&h.vy>=0){if(!h.gr&&h.vy>120)burstDust(h.x,GY,5);h.y=GY;h.vy=0;h.gr=true}else h.gr=false;
  if(h.gr){dustT+=dt;if(dustT>.07){dustT=0;burstDust(h.x-3,GY,1)}}
  for(const d of dust){d.x+=d.vx*dt;d.y+=d.vy*dt;d.l-=dt}dust=dust.filter(d=>d.l>0);
  // weather: spawn by blended weight
  const wt={};wt[p.wa]=(wt[p.wa]||0)+1-p.t;wt[p.wb]=(wt[p.wb]||0)+p.t;
  const rate={rain:70,storm:140,snow:34,petal:14,leaf:11,fire:5};
  for(const k in wt){if(!rate[k])continue;P[k]=(P[k]||0)+rate[k]*wt[k]*dt;
    while(P[k]>=1){P[k]--;const q={k,x:rnd()*(W+80),y:-4,vx:0,vy:0,l:9,ph:rnd()*6};
      if(k=='rain'||k=='storm'){q.vx=-45;q.vy=k=='storm'?230:190;q.x=rnd()*(W+100)}
      else if(k=='snow'){q.vx=-10;q.vy=22+rnd()*14}
      else if(k=='petal'){q.vx=-34;q.vy=14+rnd()*10}
      else if(k=='leaf'){q.vx=-42;q.vy=22+rnd()*10}
      else{q.x=rnd()*W;q.y=70+rnd()*60;q.l=5}
      wp.push(q)}}
  for(const q of wp){q.l-=dt;
    if(q.k=='fire'){q.x+=Math.sin(T+q.ph)*8*dt-VX*.5*dt;q.y+=Math.cos(T*.8+q.ph)*6*dt}
    else{q.x+=(q.vx-VX*.55)*dt+(q.k=='snow'||q.k=='petal'||q.k=='leaf'?Math.sin(T*2+q.ph)*14*dt:0);q.y+=q.vy*dt}
    if((q.k=='rain'||q.k=='storm')&&q.y>=GY){q.l=0;wp.push({k:'sp',x:q.x,y:GY,l:.2,vx:0,vy:0,ph:0})}
    else if(q.y>GY+3&&q.k!='sp')q.l=0;if(q.x<-12)q.l=0}
  wp=wp.filter(q=>q.l>0);
  if(wp.length>900)wp.splice(0,wp.length-900);
  const stormW=(p.wa=='storm'?1-p.t:0)+(p.wb=='storm'?p.t:0);
  if(!bolt&&stormW>.5&&rnd()<dt*.5){bolt={x:40+rnd()*240,l:.22};flash=.3}
  if(bolt){bolt.l-=dt;if(bolt.l<=0)bolt=null}
  flash=Math.max(0,flash-dt);
}

// ---- drawing ----
function cloud(x,y,sc,cols){
  for(const [col,yo,sh] of [[cols[0],3,0],[cols[1],0,1],[cols[2],-2,3]])
    for(const q of PUFF){const r=q[2]*sc-sh;if(r<2)continue;const cx=x+q[0]*sc,cy=y+q[1]*sc+yo;
      for(let dy=-r;dy<=r;dy+=2){const w=Math.sqrt(r*r-dy*dy);R(col,cx-w,cy+dy,w*2,2)}}
}
function clouds(l,p){const cols=[rgb(p[9]),rgb(p[10]),rgb(p[11])];
  for(const k of CL)if(k.l==l){const sp=W+160;const x=(((k.x-T*CDR[l]-camX*CPAR[l])%sp)+sp)%sp-80;cloud(x,k.y,k.s,cols)}}
function mtn(f,base,amp,per,col,off){
  for(let sx=0;sx<W;sx+=2){const wx=sx+camX*f+off,t=(((wx%per)+per)%per)/per,tri=Math.abs(t*2-1);
    let hh=tri*amp+Math.sin(wx*.07)*5+amp*.3;hh=((hh/4)|0)*4;R(col,sx,base-hh,2,hh+GY-base)}
}
function trees(p){
  const f=.65,sp=36,i0=Math.floor(camX*f/sp)-1,tc=rgb(p[4]),tl=rgb(mix(p[4],[255,255,255],.28)),tk=rgb(mix(p[4],[40,20,20],.6));
  for(let i=i0;i<i0+W/sp+3;i++){
    const hs=((i*2654435761)>>>0)%1000/1000;if(hs<.18)continue;
    const x=i*sp+hs*14-camX*f,ht=16+(hs*16|0);
    if(p.shape<.5){const r=7+(ht>>2);R(tk,x-1,GY-ht*.55,3,ht*.55);
      for(let dy=-r;dy<=r;dy+=2){const w=Math.sqrt(r*r-dy*dy);R(tc,x+1-w,GY-ht*.55-r+dy+r,w*2,2);if(dy<-r*.3)R(tl,x-w*.6,GY-ht*.55+dy,w*.8,2)}}
    else{R(tk,x,GY-4,3,4);for(let k=0;k<4;k++){const w=18-k*4,y=GY-6-k*7-(ht>>2);R(tc,x+1-w/2,y,w,7);R(tl,x+1-w/2,y,w/3,3)}}
  }
}
function groundSeg(a,b,p){
  const sx=Math.max(0,a-camX),ex=Math.min(W,b-camX);if(ex<=sx)return;
  const gt=rgb(p[5]),gm=rgb(p[6]),gd=rgb(p[7]),gl=rgb(p[8]);
  R(gt,sx,GY,ex-sx,3);R(gm,sx,GY+3,ex-sx,2);R(gd,sx,GY+5,ex-sx,H-GY-5);
  for(let r=0;r<5;r++){const y=GY+6+r*9;R(gl,sx,y+8,ex-sx,1);
    for(let wx=Math.floor((camX+sx)/16)*16;wx<camX+ex;wx+=16){const vx=wx+(r%2)*8-camX;if(vx>=sx&&vx<ex)R(gl,vx,y,1,9)}}
  const tuft=rgb(mix(p[5],[255,255,255],.3));
  for(let wx=Math.floor((camX+sx)/6)*6;wx<camX+ex;wx+=6){const q=(wx*7)%5;
    if(q==0)R(tuft,wx-camX,GY-1,2,1);
    if(p[19]>.05&&((wx*13)%11)<p[19]*5){const fc=['#ff6fa5','#fff','#ffd166','#c58bff'][((wx/6)|0)%4];R('#2f8a3f',wx-camX+1,GY-2,1,2);R(fc,wx-camX,GY-4,3,2)}}
}
function ground(p){
  let cur=camX-6;const pits=OB.filter(o=>o.t=='pit').sort((a,b)=>a.x-b.x);
  for(const q of pits){if(q.x>cur)groundSeg(cur,q.x,p);cur=Math.max(cur,q.x+q.w);
    const px=q.x-camX;if(px>W||px+q.w<0)continue;
    R('#1a0830',px,GY,q.w,H-GY);
    for(let i=0;i<q.w;i+=2){const yy=GY+24+Math.round(Math.sin((i+q.x+T*30)/5)*2);R('#ff6a3d',px+i,yy,2,H-yy);R('#ffd166',px+i,yy,2,1)}}
  groundSeg(cur,camX+W+6,p);
}
function objects(){
  for(const o of OB){if(o.t=='pit')continue;const x=o.x-camX;if(x>W||x<-20)continue;
    if(o.t=='box'){R('#5a3115',x,GY-14,14,14);R('#c8803f',x+1,GY-13,12,12);R('#e0a35a',x+1,GY-13,12,2);R('#8a4f22',x+1,GY-3,12,2);R('#5a3115',x+2,GY-12,1,10);R('#5a3115',x+11,GY-12,1,10);R('#8a4f22',x+3,GY-8,8,2)}
    else if(o.t=='rock'){R('#3e4454',x+1,GY-11,12,11);R('#5a6070',x+2,GY-11,9,9);R('#7b8498',x+3,GY-10,6,3);R('#9aa4b8',x+4,GY-9,3,1);R('#3e4454',x,GY-5,14,5)}
    else{const cx=x+7,cy=GY-7;R('rgba(79,209,255,.25)',cx-8,cy-8,16,16);
      for(let a=0;a<4;a++)for(let i=0;i<7;i++){const an=T*6+a*1.5708+i*.55,rr=i*1.1+1;
        R(i<3?'#ffffff':i<5?'#4fd1ff':'#7a5cff',cx+Math.cos(an)*rr-1,cy+Math.sin(an)*rr-1,2,2)}
      R('#ff4d9d',cx-1,cy-1,2,2)}}
}
function hero(){
  const ox=(h.x-4-camX)|0,oy=(h.y-11)|0;
  const leg=!h.gr?LEG.air:((T*12|0)%2?LEG.a:LEG.b);
  R('rgba(0,0,0,.25)',ox,GY,8,1);
  spr(BODY.concat(leg),ox,oy);
  R('#ffd166',ox-3,oy+(h.gr?6:7)+Math.round(Math.sin(T*22)*(h.gr?1:2)),3,1);
}
function weather(p){
  for(const q of wp){
    if(q.k=='rain'||q.k=='storm')R('rgba(190,220,255,.7)',q.x,q.y,1,4);
    else if(q.k=='sp'){c.globalAlpha=q.l*5;R('#cfe6ff',q.x-2,GY-1,1,1);R('#cfe6ff',q.x+2,GY-1,1,1);c.globalAlpha=1}
    else if(q.k=='snow')R('#fff',q.x,q.y,2,2);
    else if(q.k=='petal'){R('#ff9ecb',q.x,q.y,2,1);R('#ffd1e6',q.x+1,q.y+1,1,1)}
    else if(q.k=='leaf'){R(['#e0702a','#c8402a','#f0b030'][(q.ph*3|0)%3],q.x,q.y,2,2)}
    else if(q.k=='fire'){const b=Math.sin(T*3+q.ph)*.5+.5;c.globalAlpha=b;R('#ffe97a',q.x,q.y,2,2);c.globalAlpha=b*.25;R('#ffe97a',q.x-2,q.y-2,6,6);c.globalAlpha=1}
  }
}
function render(p){
  // sky (banded)
  for(let i=0;i<14;i++)R(rgb(mix(p[0],p[1],i/13)),0,i*10,W,10);
  R(rgb(p[1]),0,140,W,40);
  // stars
  if(p[13]>.01){STARS.forEach((q,i)=>{const tw=Math.sin(T*2+i*1.7)>-.2?1:.3;c.globalAlpha=p[13]*tw;R('#fff',q.x,q.y,1,1);if(i%6==0){R('#fff',q.x-1,q.y,3,1);R('#fff',q.x,q.y-1,1,3)}});c.globalAlpha=1}
  // aurora
  if(p[14]>.01){for(let L=0;L<3;L++){c.globalAlpha=p[14]*.22;
    for(let sx=0;sx<W;sx+=2){const y=34+L*10+Math.sin(sx*.03+T*.6+L)*12+Math.sin(sx*.08-T)*4;
      R(['#5bffb0','#6a9aff','#c06aff'][L],sx,y,2,26+Math.sin(sx*.05+T+L)*8)}}c.globalAlpha=1}
  // sun + moon
  if(p[17]>.01){c.globalAlpha=p[17];const sx=232-camX*.02,sy=92+Math.sin(T*.3)*2,sc=rgb(p[12]);
    R(rgb(mix(p[12],p[1],.55)),sx-30,sy-30,60,60);c.globalAlpha=p[17]*.8;
    for(let dy=-26;dy<=26;dy+=2){const w=Math.sqrt(676-dy*dy);R(sc,sx-w,sy+dy,w*2,2)}c.globalAlpha=1}
  if(p[18]>.01){c.globalAlpha=p[18];const mx=70,my=44;
    for(let dy=-11;dy<=11;dy+=2){const w=Math.sqrt(121-dy*dy);R('#f4f1ff',mx-w,my+dy,w*2,2)}
    R('#cfd4ee',mx-4,my-4,3,3);R('#cfd4ee',mx+2,my+3,4,3);c.globalAlpha=1}
  // rainbow
  if(p[15]>.01){c.globalAlpha=p[15]*.6;for(let k=0;k<7;k++)for(let a=3.2;a<6.2;a+=.012){const r=130-k*4;R(RB[k],150+Math.cos(a)*r-camX*.02,GY+30+Math.sin(a)*r,2,2)}c.globalAlpha=1}
  clouds(0,p);
  if(p[17]>.4){c.globalAlpha=Math.min(1,p[17]);BIRDS.forEach(b=>{const x=((b.x-T*b.v-camX*.1)%(W+40)+W+40)%(W+40)-20,w=(Math.sin(T*8+b.p)*2)|0;R('#2a2a4a',x,b.y+w,2,1);R('#2a2a4a',x+2,b.y-w,2,1);R('#2a2a4a',x+4,b.y+w,2,1)});c.globalAlpha=1}
  mtn(.2,GY-18,34,150,rgb(p[2]),0);clouds(1,p);mtn(.45,GY-8,28,110,rgb(p[3]),60);clouds(2,p);
  trees(p);
  if(p[16]>.01){c.globalAlpha=p[16]*.5;R('#fff',0,GY-38,W,38);for(let i=0;i<6;i++)R('#fff',((i*70-T*8-camX*.3)%(W+80)+W+80)%(W+80)-40,GY-50+i*6,70,4);c.globalAlpha=1}
  ground(p);objects();hero();
  for(const d of dust){c.globalAlpha=Math.max(0,d.l/.4);R('#ffd9a0',d.x-camX,d.y-1,2,2)}c.globalAlpha=1;
  weather(p);
  if(p[16]>.01){c.globalAlpha=p[16]*.25;R('#fff',0,GY-14,W,40);c.globalAlpha=1}
  if(bolt){let x=bolt.x,y=30;while(y<GY){const nx=x+(rnd()-.5)*14;R('#fff',Math.min(x,nx),y,Math.abs(nx-x)+2,6);R('rgba(180,200,255,.5)',Math.min(x,nx)-1,y,Math.abs(nx-x)+4,6);x=nx;y+=6}}
  if(flash>0){c.globalAlpha=Math.min(.45,flash*1.6);R('#fff',0,0,W,H);c.globalAlpha=1}
}
let last=performance.now();
function frame(){const n=performance.now();let dt=(n-last)/1000;last=n;if(!(dt>0))return;dt=Math.min(dt,.05);const p=palette();update(dt,p);render(p)}
function loop(){frame();requestAnimationFrame(loop)}
setInterval(function(){if(performance.now()-last>60)frame()},33);
for(let i=0;i<300;i++){wp.push({k:'rain',x:0,y:0,l:0,vx:0,vy:0,ph:0})}wp=[];
requestAnimationFrame(loop);
})();
</script>
